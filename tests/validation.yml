version: 2

models:
  - name: t_customer
    columns:
      - name: customer_id
        data_tests:
          - not_null
          - unique

  - name: t_order
    columns:
      - name: customer_id
        data_tests:
          - relationships:
              arguments:
                to: ref('t_customer')
                field: customer_id

      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: ['returned', 'completed', 'shipped', 'placed', 'return_pending']